server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 102MB
      file-size-threshold: 0
  task:
    scheduling:
      pool:
        size: 4
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/mediafactory}
    username: ${DATABASE_USER:mediafactory}
    password: ${DATABASE_PASSWORD:mediafactory}
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,mediaStorage
media:
  similarity:
    enabled: ${SIMILARITY_ENABLED:true}
    embedding:
      endpoint: ${EMBEDDING_ENDPOINT:http://localhost:8001}
    top-k: ${SIMILARITY_TOP_K:50}
    minimum-similarity: ${SIMILARITY_MINIMUM:0.70}
  qa:
    provider: ${VISION_PROVIDER:mock}
    mock-scenario: ${MOCK_VISION_SCENARIO:PERFECT}
    concurrency: ${QA_WORKER_CONCURRENCY:3}
    requests-per-minute: ${VISION_REQUESTS_PER_MINUTE:120}
    max-calls: ${VISION_MAX_CALLS:4}
    max-attempts: ${VISION_MAX_ATTEMPTS:2}
    retry-ambiguous: ${VISION_RETRY_AMBIGUOUS:false}
    fallback-providers: ${VISION_FALLBACK_PROVIDERS:}
    openai:
      enabled: ${OPENAI_VISION_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_VISION_MODEL:gpt-4.1-mini-2025-04-14}
      endpoint: ${OPENAI_VISION_ENDPOINT:https://api.openai.com/v1/responses}
      timeout-seconds: ${OPENAI_VISION_TIMEOUT_SECONDS:90}
  storage:
    type: ${STORAGE_TYPE:local}
    root: ${STORAGE_ROOT:../storage/data}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:media-factory}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
  worker:
    enabled: ${WORKER_ENABLED:true}
logging:
  structured:
    format:
      console: logstash
media-factory:
  auth:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
      email: ${ADMIN_EMAIL:admin@mediafactory.local}
    jwt:
      secret: ${JWT_SECRET:mediafactory-super-secret-jwt-key-minimum-256-bits-for-hmac-sha256-security!}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    cookie:
      name: ${AUTH_COOKIE_NAME:media_factory_jwt}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAMESITE:Lax}
    cors:
      allowed-origins: ${MEDIA_FACTORY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    endpoint: ${OPENAI_IMAGE_ENDPOINT:https://api.openai.com/v1/images/generations}
  image-generation:
    default-provider: ${MEDIA_FACTORY_IMAGE_PROVIDER:mock}
    environment: ${MEDIA_FACTORY_ENVIRONMENT:development}
    worker-concurrency: ${IMAGE_WORKER_CONCURRENCY:4}
    lease-duration: 5m
    routing:
      fallback-enabled: ${IMAGE_FALLBACK_ENABLED:false}
      fallback-providers: ${IMAGE_FALLBACK_PROVIDERS:}
      mock-production-fallback-enabled: ${MOCK_PRODUCTION_FALLBACK_ENABLED:false}
    providers:
      mock:
        enabled: true
        model: studio-mock-v1
        models: [ studio-mock-v1 ]
        mock-scenario: ${MOCK_IMAGE_SCENARIO:success}
        rate-limit:
          requests-per-minute: 120
          concurrent-requests: 3
        retry:
          max-attempts: 3
      openai:
        enabled: ${OPENAI_IMAGE_ENABLED:false}
        model: ${OPENAI_IMAGE_MODEL:gpt-image-2}
        models: [ gpt-image-2, gpt-image-1.5, gpt-image-1 ]
        timeout:
          connect: ${OPENAI_CONNECT_TIMEOUT:10s}
          request: ${OPENAI_IMAGE_TIMEOUT:120s}
        rate-limit:
          requests-per-minute: ${OPENAI_REQUESTS_PER_MINUTE:20}
          concurrent-requests: ${OPENAI_MAX_CONCURRENT:3}
        retry:
          max-attempts: ${OPENAI_MAX_ATTEMPTS:3}
          initial-delay: 1s
          max-delay: 30s
          multiplier: 2
          jitter: true
          retry-ambiguous: ${OPENAI_RETRY_AMBIGUOUS:false}
        circuit:
          failure-threshold: 3
          cooldown: 60s
        pricing:
          "[gpt-image-2]":
            version: "2026-09-24"
            source: https://developers.openai.com/api/docs/pricing
            currency: USD
            text-input-per-million: 2.50
            image-input-per-million: 4.00
            output-per-million: 15.00
bulk:
  worker:
    concurrency: ${BULK_WORKER_CONCURRENCY:3}
    requests-per-minute: ${BULK_WORKER_RPM:20}
    max-attempts: ${BULK_WORKER_MAX_ATTEMPTS:3}
    poll-ms: ${BULK_WORKER_POLL_MS:1000}
    retry:
      initial-delay-ms: ${BULK_RETRY_INITIAL_DELAY_MS:2000}
      max-delay-ms: ${BULK_RETRY_MAX_DELAY_MS:120000}
      multiplier: ${BULK_RETRY_MULTIPLIER:2.0}
      jitter: ${BULK_RETRY_JITTER:true}
  zip:
    max-archive-bytes: ${BULK_ZIP_MAX_ARCHIVE:104857600}
    max-extracted-bytes: ${BULK_ZIP_MAX_EXTRACTED:268435456}
    max-entry-bytes: ${BULK_ZIP_MAX_ENTRY:16777216}
    max-files: ${BULK_ZIP_MAX_FILES:5000}
    max-tasks: ${BULK_ZIP_MAX_TASKS:1000}
    max-depth: ${BULK_ZIP_MAX_DEPTH:2}
    max-ratio: ${BULK_ZIP_MAX_RATIO:200}
    max-prompt-bytes: ${BULK_ZIP_MAX_PROMPT:40000}
    max-image-pixels: ${BULK_ZIP_MAX_PIXELS:40000000}
tiktok:
  enabled: ${TIKTOK_ENABLED:false}
  client-key: ${TIKTOK_CLIENT_KEY:}
  client-secret: ${TIKTOK_CLIENT_SECRET:}
  redirect-uri: ${TIKTOK_REDIRECT_URI:http://localhost:3000/publishing/tiktok/callback}
  api-base-url: ${TIKTOK_API_BASE_URL:https://open.tiktokapis.com}
  auth-url: ${TIKTOK_AUTH_URL:https://www.tiktok.com/v2/auth/authorize/}
  mock-scenario: ${TIKTOK_MOCK_SCENARIO:SUCCESS}
  rpm-limit: ${TIKTOK_RPM_LIMIT:6}
  max-attempts: ${TIKTOK_MAX_ATTEMPTS:5}
publishing:
  worker:
    enabled: ${PUBLISHING_WORKER_ENABLED:true}
    concurrency: ${PUBLISHING_WORKER_CONCURRENCY:2}
    max-attempts: ${PUBLISHING_WORKER_MAX_ATTEMPTS:5}
    poll-ms: ${PUBLISHING_WORKER_POLL_MS:1000}
    retry:
      initial-delay-ms: ${PUBLISHING_RETRY_INITIAL_DELAY_MS:2000}
      max-delay-ms: ${PUBLISHING_RETRY_MAX_DELAY_MS:60000}
  zip:
    max-archive-bytes: ${PUBLISHING_ZIP_MAX_ARCHIVE:104857600}
    max-extracted-bytes: ${PUBLISHING_ZIP_MAX_EXTRACTED:536870912}
    max-entry-bytes: ${PUBLISHING_ZIP_MAX_ENTRY:104857600}
    max-files: ${PUBLISHING_ZIP_MAX_FILES:500}
    max-tasks: ${PUBLISHING_ZIP_MAX_TASKS:200}

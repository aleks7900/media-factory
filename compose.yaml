name: media-factory
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mediafactory
      POSTGRES_USER: ${DATABASE_USER:-mediafactory}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mediafactory}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d mediafactory"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: /bin/sh
    command: ["-c", "mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY && mc mb --ignore-existing local/media-factory && mc version enable local/media-factory"]
  backend:
    build: ./backend
    environment:
      EMBEDDING_ENDPOINT: http://embedding:8000
      DATABASE_URL: jdbc:postgresql://postgres:5432/mediafactory
      DATABASE_USER: ${DATABASE_USER:-mediafactory}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-mediafactory}
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: media-factory
      MEDIA_FACTORY_IMAGE_PROVIDER: ${MEDIA_FACTORY_IMAGE_PROVIDER:-mock}
      MEDIA_FACTORY_ENVIRONMENT: ${MEDIA_FACTORY_ENVIRONMENT:-development}
      OPENAI_IMAGE_ENABLED: ${OPENAI_IMAGE_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VISION_PROVIDER: ${VISION_PROVIDER:-mock}
      OPENAI_VISION_ENABLED: ${OPENAI_VISION_ENABLED:-false}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini-2025-04-14}
      OPENAI_VISION_TIMEOUT_SECONDS: ${OPENAI_VISION_TIMEOUT_SECONDS:-90}
      MOCK_VISION_SCENARIO: ${MOCK_VISION_SCENARIO:-PERFECT}
      QA_WORKER_CONCURRENCY: ${QA_WORKER_CONCURRENCY:-3}
      VISION_REQUESTS_PER_MINUTE: ${VISION_REQUESTS_PER_MINUTE:-120}
      VISION_MAX_CALLS: ${VISION_MAX_CALLS:-4}
      VISION_MAX_ATTEMPTS: ${VISION_MAX_ATTEMPTS:-2}
      VISION_RETRY_AMBIGUOUS: ${VISION_RETRY_AMBIGUOUS:-false}
      VISION_FALLBACK_PROVIDERS: ${VISION_FALLBACK_PROVIDERS:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-10s}
      OPENAI_IMAGE_TIMEOUT: ${OPENAI_IMAGE_TIMEOUT:-120s}
      OPENAI_REQUESTS_PER_MINUTE: ${OPENAI_REQUESTS_PER_MINUTE:-20}
      OPENAI_MAX_CONCURRENT: ${OPENAI_MAX_CONCURRENT:-3}
      OPENAI_MAX_ATTEMPTS: ${OPENAI_MAX_ATTEMPTS:-3}
      OPENAI_RETRY_AMBIGUOUS: ${OPENAI_RETRY_AMBIGUOUS:-false}
      IMAGE_FALLBACK_ENABLED: ${IMAGE_FALLBACK_ENABLED:-false}
      IMAGE_FALLBACK_PROVIDERS: ${IMAGE_FALLBACK_PROVIDERS:-}
      MOCK_PRODUCTION_FALLBACK_ENABLED: ${MOCK_PRODUCTION_FALLBACK_ENABLED:-false}
      MOCK_IMAGE_SCENARIO: ${MOCK_IMAGE_SCENARIO:-success}
      IMAGE_WORKER_CONCURRENCY: ${IMAGE_WORKER_CONCURRENCY:-4}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  embedding:
    build: ./workers/similarity/embedding
    environment:
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-AUTO}
      TORCH_THREADS: ${EMBEDDING_THREADS:-4}
    volumes: ["embedding_models:/models"]
    ports: ["127.0.0.1:8001:8000"]
    restart: unless-stopped
volumes:
  embedding_models:
  postgres_data:
  minio_data:

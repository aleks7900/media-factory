server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
 location /actuator/health { proxy_pass http://backend:8080; }
 location /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
 location / { try_files $uri $uri/ /index.html; }
}
